 "machine_readable": "pdf_only", "date_format": "DD Month YYYY (e.g. 29 November 2023)", "pagination": "none - 31 items on a single page", "cadence": "stale - most recent item observed is 29 November 2023", "tmt_relevance": "Occasional scheme-obligation and agreement-amendment notices for rural rollout clients", "priority": "watch", "quirks": "Feed appears dormant since late 2023. Some entries are sentence fragments rather than titles (one is a truncated quote), so titles are unreliable as identifiers. No separate circulars/guidelines listing exists - Act & Rules and Tenders are the only other document shelves", "domain": "Telecom, spectrum and equipment", "in_tracker": "not_wired"}, {"id": "usof_redirect", "regulator": "DoT - Digital Bharat Nidhi (formerly USOF)", "name": "USOF legacy domain (redirects)", "url": "https://usof.gov.in/", "publishes": "n/a - redirect only", "fetch_status": "OK", "machine_readable": "none", "date_format": "n/a", "pagination": "n/a", "cadence": "n/a", "tmt_relevance": "Confirms the USOF to Digital Bharat Nidhi rename under the Telecommunications Act 2023", "priority": "watch", "quirks": "HTTP 302 to https://dbn.gov.in/en/home. Any stored usof.gov.in deep links should be re-based on dbn.gov.in. Note the TTDF sub-portal is still on the old domain: https://ttdf.usof.gov.in/", "domain": "Telecom, spectrum and equipment", "in_tracker": "not_wired"}, {"id": "wpc_legacy_site_nfap", "regulator": "DoT - WPC Wing", "name": "Legacy WPC site - NFAP page", "url": "http://wpc.dot.gov.in/content/6_1_NFAP.aspx", "publishes": "Historic NFAP editions and WPC static content", "fetch_status": "TIMEOUT", "machine_readable": "none", "date_format": "not observable", "pagination": "not observable", "cadence": "effectively frozen", "tmt_relevance": "Historic NFAP editions only; superseded by dot.gov.in and eservices.dot.gov.in", "priority": "watch", "quirks": "Connection timed out (robots.txt unreachable). HTTP-only legacy ASPX host that appears to be decommissioned or intermittently down - do not put it on a monitoring schedule", "domain": "Telecom, spectrum and equipment", "in_tracker": "not_wired"}], "notes": ["unpublished_instruments: Best estimate: for TMT specifically, somewhere between a third and a half of the instruments that actually bind a client never appear on any official website - and for the content-regulation subset (blocking, takedown, advisories to intermediaries and broadcasters) it is the overwhelming majority, well above 90 percent. That estimate is bounded by what is directly observable rather than asserted. WHAT WE OBSERVED. First, a hard legal bar on publication: Rule 16 of the IT Blocking Rules imposes strict confidentiality on everything done under Section 69A, which means the government can block content without issuing a reasoned public order and without notifying the originator, and it refuses RTI requests for those orders on that basis. MeitY has stated on the record that Section 69A orders cannot be disclosed. Second, the volume behind that bar: SFLC.in's RTI work established 14,221 websites blocked between 2010 and 2018, with MeitY refusing to release the 2018 URLs or any copies of the orders. A separate RTI on the IT Rules 2021 machinery drew a 'Nil' answer from the MIB CPIO on orders issued by the Authorised Officer and an outright refusal, under Section 8(1)(a), of the Inter-Departmental Committee and Review Committee records. The same reporting established that the IT Rules 2021 were never tabled in Parliament, so even the parliamentary channel is closed. The count of published 69A orders across that entire period is effectively zero. Third, a newer and larger unpublished channel: the Sahyog portal, with at least 94 intermediaries onboarded as of April 2026, routes Section 79(3)(b) notices from state police directly to platforms. Authorisation to issue those notices has been devolved unevenly - 23 officers at DCP rank and above in Delhi, ACP rank in Karnataka, DSP level in some states, a single officer in Bihar - and, as a former MeitY official put it, there is no consolidated public list of who holds that power, let alone of the notices they send. Nothing about this channel touches a gazette or a website. Fourth, the same pattern outside content regulation, which is the part firms underestimate. The MIB advisory of 4 August 2025 requiring broadcasters to exit Asiasat AS-5 and AS-7 services by 31 March 2026 was a hard commercial deadline with no reference number, no link to any government page, and no disclosure of provenance - it reached the market through Storyboard18. X's disclosure in the Punjab and Haryana High Court that Punjab police had issued blocking instructions surfaced only through litigation. DoT licence-amendment letters and TRAI directions served on named licensees follow the same shape. Fifth, even nominally published material fails the test in practice: MeitY's own draft IT Rules consultations of March and April 2026 were posted as opaque MD5-named PDFs under /static/uploads/YYYY/MM/ on a site whose HTML listing layer would not render for our fetcher at all, with comment windows of 15 and 16 days. Formally public; operationally invisible unless something links to it - and what linked to it was MediaNama, which also mirrored the PDF. Sixth, the official venues themselves under-report: the e-Gazette's own 'Recent Extraordinary Gazettes' panel was eleven weeks stale on the day we checked. HOW THE PROPORTION BREAKS DOWN. Gazetted instruments - rules, amendment rules, GSR/SO notifications - are close to fully published, because gazette publication is what makes them legally operative; that is the third-to-half that IS catchable, and the e-Gazette plus a mirror will get essentially all of it. Circulars, directions and clarifications issued by TRAI, DoT and MIB are patchily published, often only as PDFs on pages with no index and no dates. Advisories, licence-amendment letters, blocking and takedown orders, and Sahyog notices are effectively never published, by design. Weight those three tiers by how often they actually change a TMT client's obligations and the middle-to-high thirties is a defensible floor for the overall share, rising to near-total for the content layer. THE ONLY REALISTIC WAY TO CATCH THEM. There is no scraping answer, because there is no server holding the document. Four channels, in descending yield. (1) The specialist press and NGOs, treated as a primary tier rather than as commentary - MediaNama, IFF, SFLC.in, Storyboard18 for broadcast, tele.net and ET Telecom for telecom, ThePrint for litigation-surfaced material. Every single unpublished instrument named above became knowable through this channel and through no other. Ingest them at the same priority as the gazette, and capture the mirrored PDFs they host, because those mirrors frequently outlive the government link. (2) Litigation and disclosure, monitored deliberately: platforms compelled to plead in court are the most reliable disclosure mechanism India has for blocking and takedown instruments - watch Delhi HC, Karnataka HC and Punjab and Haryana HC filings in platform-versus-government matters, and Digital Policy Alert's India page, which is unusual in coding court orders alongside regulatory acts. (3) The firm's own client base, which is the highest-value channel and the one only a law firm has: an advisory served on one client IS the instrument, and a disciplined intake that logs every government letter, notice and advisory a client receives - date, issuing office, reference number, text - builds a proprietary corpus of exactly the material no crawler can reach. Nothing else in this list produces the instrument itself rather than a report of it. (4) RTI, used systematically and with realistic expectations: it will be refused for anything under Section 69A, but it reliably produces aggregate counts, authorisation lists and process records, and the refusals themselves are dateable evidence that an instrument exists. Practical design conclusion: build the official-venue scrapers for provenance and citation, and build the tracker's actual detection layer on the secondary press plus client intake. A tracker that only crawls regulator sites will be accurate about what it reports and wrong about what it misses - and it will miss the instruments that most often carry a deadline.", "egazette_mechanics: egazette.gov.in is a stateful ASP.NET WebForms application. There is no API, no RSS, no JSON and no querystring interface - a ministry-plus-date query cannot be expressed as a URL, only as a sequence of form POSTs that share a cookie session. VERIFICATION NOTE: the homepage (https://egazette.gov.in/) fetched OK and is described from direct observation; the search form itself was unreachable for us (robots.txt retrieval failed, once with an SSL certificate-verify error), so its mechanics below are reconstructed from the reference implementation at github.com/sushant354/egazette (srcs/central.py), which we read directly and which is the de-facto documentation for this site. THE SEQUENCE. (1) GET https://egazette.gov.in/ with a persistent cookie jar - in the reference code this is download_oneday() calling download_url(self.baseurl, savecookies=cookiejar, loadcookies=cookiejar). This response is the only source of the initial hidden-field values, and the server may hand back a session-bearing path segment of the form /(S(<guid>))/ that must be preserved on every subsequent URL. (2) Harvest the hidden fields from that response - __VIEWSTATE, __VIEWSTATEGENERATOR and __EVENTVALIDATION - together with the current value of every input and select on the form (get_form_data() / get_post_data() in the reference). These are single-use and rotate on every response: you must re-harvest from the LAST response before each POST, never cache them, and never reuse a viewstate across sessions or the server returns a validation error rather than results. (3) POST the whole reconstructed form to SearchCategory.aspx, resolved as urljoin(current_url, 'SearchCategory.aspx'). The meaningful controls are ddlGazetteCategory (set to 'Weekly' or 'Extra Ordinary' - the reference stores this as self.gztype and drives CentralWeekly vs CentralExtraordinary from it), ddlMinistry (the ministry selector - this is the field a TMT tracker pins to MeitY, DoT or MIB), ddlPartSection (part/section of the gazette), and the date range as text inputs txtDateFrom and txtDateTo formatted by the helper utils.get_egz_date(dateobj). Because these are auto-postback dropdowns, selecting a ministry is itself a postback: set __EVENTTARGET to the dropdown's control name, POST, take the fresh viewstate from the reply, and only then POST the date range. Practically you should treat one query as three or four chained POSTs, not one. (4) Parse results out of the table with id='tbl_Gazette'. Columns match the homepage: Ministry, Subject, Publish Date, Gazette ID, Download. Dates are DD-MMM-YYYY; the Gazette ID CG-DL-E-DDMMYYYY-NNNNNN independently encodes the publication date and the E/W flag, so use it as the primary key and as a checksum on the date column. Note the Subject column is truncated with an ellipsis in the HTML, so never keyword-match on it alone. (5) PAGINATION is pure ASP.NET postback. The next-page control is not an href to another URL - it is javascript:__doPostBack('<target>','<argument>'). The scraper must regex the target and argument out of that href (find_next_page() / download_nextpage() in the reference), set __EVENTTARGET and __EVENTARGUMENT accordingly, re-attach the freshly harvested viewstate, and POST again to the same endpoint. Skipping to page N directly is impossible; you must walk pages in order. (6) THE PDF IS NOT LINKED. The download cell fires window.open('<relative-url>') via JavaScript. You POST for that row, regex the href out of the window.open call, fetch the resulting viewer page, read the src attribute of the iframe with id='framePDFDisplay', and urljoin that against https://egazette.gov.in to get the actual PDF. That is four or more sequential requests per single notification, all inside the same cookie session. PRACTICAL CONSEQUENCES FOR A TRACKER. Budget one session per query window and expect to re-establish it often; viewstate expiry mid-walk is the normal failure mode and the correct recovery is to restart the whole sequence from step 1, not to retry the POST. Rate-limit hard - the site is slow and unforgiving. Most importantly, DO NOT USE THE HOMEPAGE 'Recent Extraordinary Gazettes' PANEL AS A FRESHNESS OR COMPLETENESS SIGNAL: on 24 August 2026 its newest row was dated 04-Jun-2026, roughly eleven weeks stale, while the commercial mirror gazettetracker.com had gazettes indexed to 22-Aug-2026 and claims a ~13 minute lag. MIRRORS. Two exist and both matter. gazettetracker.com is a live commercial mirror of central Extraordinary gazettes with full-text search, per-notification pages at /g/<GAZETTE_ID>, email alerts and a JSON webhook API at INR 5,000/month delivering gazette ID, dates, ministry/department/office, subject, section references, extracted full text and the source-PDF link within about fifteen minutes of publication; its index held 27,469 entries and full text sits behind a login. The Internet Archive holds scanned historical runs under identifiers of the form in.gazette.<YYYY>.<issue> (confirmed from in.gazette.1947.168 through in.gazette.2014.319), queryable via advancedsearch.php with output=json - historical backfill only, and archive.org was denied by this session's egress policy so it could not be fetched directly. The open-source github.com/sushant354/egazette additionally covers the central weekly and extraordinary gazettes plus roughly thirty state gazettes, and is the fastest way to get a working central scraper without rediscovering the viewstate dance.", "meity_access: CONFIRMED JS-only. Every HTML page on www.meity.gov.in returns an identical near-empty shell to a plain GET - only <meta name=viewport>, meta-description ('Your website description goes here'), a google-site-verification token and a favicon og:image. Verified on 11 distinct URLs: /, /documents, /documents/act-and-policies, /documents/orders-and-notices, /documents/publications, /documents/press-release, /documents/gazettes-notifications, /documents/guidelines, a document detail page (/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa), the OGAI organisation page, and the legacy /artificial-intelligence-committees-reports page. Unknown paths do not 404 - they also return the shell, so /api/documents and /jsonapi both came back as the shell, which means negative results cannot distinguish 'no such endpoint' from 'endpoint exists'. No JSON/REST endpoint was found. WORKAROUNDS VERIFIED, in order of usefulness: (1) https://www.meity.gov.in/sitemap.xml is served as genuine static XML and lists 50 URLs covering every document shelf and its ?page=N variants - it is the reliable map of the site's IA, but it carries NO <lastmod> and NO individual document URLs, so it cannot drive change detection. robots.txt is 'User-agent: * / Allow: /' and does not reference the sitemap. (2) The PDF store at https://www.meity.gov.in/static/uploads/YYYY/MM/<file>.pdf serves real bytes to plain fetches with no JS - verified twice: a 32-hex-hashed name (2026/05/cd481c027470b420b4cb85fb40a91c53.pdf, the DPBI Chairperson/Member recruitment notice F. No. 2(1)/2026-Pers.I dated 6.5.2026) and a legacy human-readable name (2024/02/24rpr.pdf, Consolidated FDI Policy). Both filename conventions coexist; hashes are not enumerable and no directory index is exposed, so paths must be harvested rather than guessed - the YYYY/MM bucket is the upload month. (3) Document URL grammar was confirmed as /documents/<shelf>/<kebab-slug>-<11-char-opaque-id> (e.g. -gDOxUjMtQWa), with the same grammar on organisation pages (-MzNxgjMtQWa); the id is not derivable from the title, and an optional cosmetic ?pageTitle= parameter is accepted. (4) Legacy /content/<slug> URLs from the previous site still appear in search indexes (e.g. /content/draft-digital-personal-data-protection-rules2025, /content/notice-public-consultation-dpdp-2022) but the /archives?page=gazettes-notifications route also returns the shell, so the old site is not a live fallback. (5) Best practical alternates, all verified fetchable: PIB (www.pib.gov.in/Allrel.aspx plus PressReleasePage.aspx?PRID=<id>) mirrors MeitY press material, and static.pib.gov.in hosts MeitY policy PDFs - the India AI Governance Guidelines were verified there, not on meity.gov.in; egazette.gov.in is the authoritative source for notified instruments. NET RECOMMENDATION: render MeitY shelves with a headless browser seeded from sitemap.xml, harvest the /static/uploads/ PDF URLs, and cross-check against PIB and eGazette.", "Recommended core loop, ordered by yield per unit of engineering: gazette layer (gazettetracker webhook as primary signal, egazette SearchCategory.aspx postback as the citable source of record, archive.org for backfill); announcement layer (PIB allRel.aspx polled per-ministry for MeitY/DoT/MIB, since the RSS is too lossy to rely on); detection layer for unpublished instruments (MediaNama via sitemap_index.xml not the robots-blocked feed, IFF /rss/, SFLC /feed/, Storyboard18 by HTML crawl of /latest-news, tele.net /rss, ET Telecom /rss/policy once unblocked); legislative layer (PRS Bill Track by HTML diff, ignoring its frozen sitemap); international layer (EDPB /feed/news_en and /feed/publications_en, ITU hub feed, EUR-Lex via the CELLAR SPARQL endpoint rather than RSS, Ofcom by HTML diff). Then the channel no crawler provides: a structured intake that logs every government letter, notice and advisory the firm's own clients receive.", "Priority guidance for a monitoring build, in the order I would actually implement it. Tier 1, cheap and high-yield, do first: the two RBI RSS feeds, the RBI fn=9 payments notification filter, the DoT eServices circular feed, and the NCCS listings - all server-rendered, all cleanly dated, all directly binding on TMT clients. Tier 2, needs care but no browser: NPCI UPI/RuPay/NFS (respect robots, key on circular number, accept the public shelf is incomplete), the BIS upcoming-QCO calendar, crsbis.in product and MeitY-order pages, TEC essential requirements. Tier 3, needs a headless browser or a manual diary: the MTCTE portal data tables, dot.gov.in, meity.gov.in and dpiit.gov.in scheme and QCO pages, and the e-Gazette. Excluded from monitoring on verified grounds: C-DOT (no binding instruments), the legacy wpc.dot.gov.in host (decommissioned), and DBN press releases (dormant since 2023, keep as a low-frequency watch).", "Two NPCI quirks the firm should know before relying on that shelf. First, the UPI page carries NO calendar dates at all - only fiscal-year labels, formatted inconsistently ('FY 24-25' vs 'FY 23 24') - so the OC number is the only usable sort key and ordering by date is impossible from the listing. RuPay, by contrast, does use real DD-Mon-YYYY dates and a different reference scheme entirely (NPCI/2020-21/RuPay/022). One parser will not serve both. Second, and more significant for advice: a substantial number of UPI circular rows are not public at all - the entry reads 'Please get in touch with your bank' in place of a document. The public shelf is therefore knowingly incomplete, and for clients that are TPAPs rather than member banks, the practical route to the full circular set is their sponsor PSP bank, not this page. Flag that limitation in any monitoring SLA.", "LANGUAGE PREFIX - VERIFIED BY DIRECT COMPARISON: on mib.gov.in the /en/ prefix returns English and the unprefixed path returns Hindi, for the same shelf, with no redirect and no error. Fetching https://mib.gov.in/documents/notification/acts-policy-guidelines returned Devanagari titles ('टीवी रेटिंग नीति 2026- टेलीविजन रेटिंग के विनियमन संबंधी दिशानिर्देश') while https://mib.gov.in/en/documents/notification/acts-policy-guidelines returned English ('Television Ratings Policy 2026-Guidelines for the Regulation of Television Ratings'). Row ordering, DD-MM-YYYY dates and pagination are identical between the two, so a scraper that drops the prefix fails SILENTLY - the fetch succeeds, dates parse, and only the titles are unusable. Every MIB URL in this map is recorded with the /en/ prefix and a scraper must use it.", "DATE FORMAT FRAGMENTATION IS THE PRIMARY SCRAPER RISK ACROSS THIS DOMAIN. Nine distinct formats were observed: DD-MM-YYYY (all MIB shelves, PRGI, CBFC), DD.MM.YYYY (Broadcast Seva notices, DD Free Dish), DD/MM/YYYY (Prasar Bharati programme guidelines), YYYY-MM-DD ISO (DPCGC - the only ISO user, and a parser tuned to Indian day-first order will silently misread it), Month DD YYYY (ASCI advisories, inconsistently zero-padded), DD Mon YYYY (ASCI complaint outcomes), Month YYYY with no day (ASCI press announcements, ASCI non-compliant list), D.M.YYYY unpadded (NBDSA decisions - the most fragile, genuinely ambiguous, force day-first parsing), and DD_MM_YY embedded in filenames only (NBDA guidelines). Prasar Bharati and ASCI are each internally inconsistent, using two different formats on their own pages.", "Saral Sanchar replacement, confirmed on the record: https://eservices.dot.gov.in/ consolidates 20+ legacy DoT portals. Its own Saral Sanchar page states that acceptance of new applications under the Indian Telegraph Act 1885 has stopped for all Unified Licences and that applicants migrate to the Authorisation Portal from 25 June 2026, with Saral Sanchar retained for lifecycle actions (renewal, amendment, surrender) on legacy licences. New filings run under the Telecommunications Act 2023 via https://authorisation.dot.gov.in/login. The ETA page carries the same statement independently. Saral Sanchar itself (saralsanchar.gov.in, both root and LoginHome.php) returns 403 to non-browser clients, so track its status through the eServices page rather than the portal.", "BIS is split across three hosts with different technology and must not be scraped as one site: www.bis.gov.in is server-rendered, standards.bis.gov.in is a JS SPA that returns a shell exactly like MeitY, and services.bis.gov.in is server-rendered PHP that does expose committee data. A concrete trap was verified on services.bis.gov.in: pow_details?tecd=66 lists all of LITD 1-38 but renders detail only for LITD 1, because tecd selects the department rather than the committee - so LITD 30 (Artificial Intelligence, chaired by MeitY's Kavita Bhatia, 41 members) is not reachable from that URL despite appearing in its table. Committee identifiers appear base64-encoded elsewhere (commttid=Mzg2 is 386, commttname=TElURCAzMA== is 'LITD 30').", "Mirrors and workarounds for the JS-only hosts: (a) DoT - use https://eservices.dot.gov.in/circular-notifications-others, which is fully server-rendered, paginated and carries DoT circulars, notifications and orders with clean DD/MM/YYYY dates; it is a better source than dot.gov.in even if dot.gov.in worked. (b) MeitY electronics/CRS orders - use https://www.crsbis.in/BIS/meity_notification.do, which carries the operative MeitY CRS orders as PDFs. (c) DPIIT QCOs - use the BIS 'Upcoming QCOs' table, which names the issuing department, plus the e-Gazette. (d) MeitY scheme conditions - ECMS has its own working host at https://ecms.meity.gov.in/, but PLI-LSEM and SPECS have no fetchable mirror and genuinely need a browser.", "PRGI FETCH INSTABILITY - PARTIAL VERIFICATION: prgi.gov.in intermittently fails robots.txt retrieval with '[SSL: CERTIFICATE_VERIFY_FAILED] self-signed certificate in certificate chain', causing ROBOTS_DISALLOWED errors that come and go for the same URL within a single session. Every PRGI URL recorded above was fetched successfully at least once and its content confirmed; several required retries. Expect transient failures in production and implement retry with backoff rather than treating a single failure as a dead venue. The advisories archive is at /latest-updates - the intuitive paths /advisories, /advisory, /whats-new, /public-notice, /public-notices, /circulars and /notifications were all tried and all failed.", "On the consultation question: there is no central Indian portal where draft rules go out for comment. The Pre-Legislative Consultation Policy 2014 directs ministries to publish drafts on their OWN websites for 30 days, and it is advisory rather than binding - which is why the two most consequential TMT consultations of 2026, both rounds of draft IT Rules amendments, appeared as unindexed hash-named PDFs on meity.gov.in and never on MyGov. MyGov's Discuss section at fetch time carried five open items, all non-TMT (Jal Shakti, Mann Ki Baat, Finance x2, MCA/ICAI), and innovateindia.mygov.in is a hackathon platform, not a rulemaking venue. Track MyGov for completeness, but never treat it as the consultation tracker.", "Date-format normalisation is a real engineering cost across this set and worth centralising on day one. Observed in production: DD-MMM-YYYY (e-Gazette), DD/MM/YYYY (MyGov, innovateindia), 'Month DD, YYYY' (MediaNama, PRS, Digital Policy Alert), 'D Month YYYY' (Ofcom, gazettetracker), 'DD Mon YYYY HH:MM:SS AM/PM' (PIB), RFC-822 at +0000 (SFLC, IFF, ThePrint, ITU), RFC-822 at +0530 (tele.net), bare IST clock times with no date (Storyboard18 articles), relative strings like '21 hours ago' (exchange4media), Saka-era dates alongside Gregorian inside gazette PDFs, and no date at all in the PIB RSS. Note also that PIB renders month names in Hindi even on English pages, so match dropdowns by index rather than by label.", "TEC/MTCTE splits awkwardly. The policy narrative pages on tec.gov.in are server-rendered and useful - especially https://www.tec.gov.in/essential-requirements, which lists ~70 ERs with TEC codes and effective dates, and the MTCTE page listing 60+ notifications including phase mandates, procedure amendments and exemptions. But every DATA TABLE on the mtcte.tec.gov.in portal (er_list, downloads, phaseWiseproductsList) is loaded by JavaScript and returns headers with an empty body. One substantive point for advice, stated by the portal itself: where the portal-form ER and the original-form ER conflict, the PORTAL version prevails. Clients working from a downloaded PDF ER may be working from the wrong text.", "Verification scorecard: 24 of 29 venues fetched successfully. Confirmed working feeds, ranked by reliability - sflc.in/feed/ and internetfreedom.in/rss/ and itu.int/hub/feed/ and edpb.europa.eu/feed/news_en and theprint.in/category/tech/feed/ and tele.net.in/rss all return valid RSS with proper dates. Confirmed to have NO feed at all: exchange4media (all four candidate paths checked), Ikigai Law (/feed/ 404, custom CMS), PRS Legislative Research (/theprsblog/feed returns 500), TeamLease RegTech, Ofcom, ICO, and the e-Gazette itself. Feed exists but is unusable: PIB (no pubDate, ~19 items, language parameter ignored), MediaNama (robots-disallowed), Storyboard18 (403 on feed paths only).", "Environment caveat, so results are not misread as site defects: this session's egress proxy denied several hosts outright with HTTP 403 on CONNECT, including telecom.economictimes.indiatimes.com and archive.org (the proxy log also showed prior denials for saralsanchar.gov.in, wpc.dot.gov.in and tec.gov.in). Those venues are marked BLOCKED and should be re-verified from the firm's own network. Separately, robots.txt restrictions blocked our fetcher from egazette.gov.in/SearchCategory.aspx, egazette.gov.in/GazetteDirectory.aspx, medianama.com/feed/ and eur-lex.europa.eu/oj/all/all-oj-date.html - those are real robots policies a compliant production scraper will also hit.", "PIB, definitively: there is NO per-ministry RSS. The RSS index at ViewRss.aspx lists exactly three feeds, all content-type not ministry - ModId=6 press releases, ModId=8 photos, ModId=18 features, under the pattern RssMain.aspx?ModId=<n>&Lang=1&Regid=3. Ministry filtering exists only through the allRel.aspx postback form. And on the press-release versus press-note question: PIB has no press-note feed, because a 'press note' in Indian practice is a ministry instrument on ministry letterhead (DPIIT FDI press notes, MIB advisories) that lives on the ministry's own site if anywhere - PIB's own second channel is ModId=18 Features, which carries explainers, not instruments.", "Two accidental findings worth acting on. gazettetracker.com is a live commercial mirror of the central e-Gazette that was indexed to 22-Aug-2026 while the official homepage showed 04-Jun-2026 - it appears to be the fastest available signal on Indian gazette publication, at INR 5,000/month for webhook access, and its per-notification pages at /g/<GAZETTE_ID> are directly fetchable. And github.com/sushant354/egazette is the de-facto documentation for the e-Gazette's ASP.NET internals plus roughly thirty state gazettes - reading it saved rediscovering the viewstate sequence and it should be the starting point for the gazette scraper rather than a from-scratch build.", "RBI's most dangerous scraper trap is the Master Directions page. MDs are amended IN PLACE: the displayed date is the original issue date while the true currency is buried in an 'Updated as on <date>' clause inside the title string. A date-based change detector will never fire on an amendment. Hash the PDF or parse the updated-as-on clause. Separately, RBI uses at least four incompatible deep-link parameters across its shelves - ?Id= (notifications), ?id= (master directions, publications), ?prid= (press releases) and ?Id=&fn=9 (payment-system notifications) - and all ids are non-sequential and non-semantic, so they must be harvested rather than constructed.", "BROADCAST SEVA IS THE HARDEST TARGET AND NEEDS A THREE-PART STRATEGY: the landing page is JS-driven with javascript:; controls and login redirects; Sitemap.jsp is server-rendered and is the reliable crawl entry point; guideline PDFs are directly reachable at /jsp/mib/common/PDFContent/{CATEGORY}_PDF/Guidelines.pdf without login. What's New announces advisories by title and date but often without a link, and the documents behind it are addressed only by opaque non-enumerable numeric attachIds via the Upload?flag=iframeAttachView endpoint. In practice, monitor MIB's advisories shelf for the document and use Broadcast Seva for the licensing thresholds.", "Coverage gaps worth a second pass from an Indian IP: NCIIPC's per-year advisory pages (pattern alerts_advisories_more_YYYY.html is confirmed for 2016-2020 via search indexes but the 2026 page could not be fetched, so its existence is inferred), the full I4C and Sahyog document sets, and the UIDAI shelves that robots.txt blocks. Also unresolved: whether the MeitY SPA calls a JSON endpoint at all - because unknown paths return the shell rather than a 404, endpoint probing cannot produce a negative result, and settling this requires reading the app's JS bundle or capturing XHR traffic in a real browser, which this session could not do.", "NFAP is the one core instrument I could not pin to a live, verified URL. The DoT announcement page (dot.gov.in/whatsnew/national-frequency-allocation-plan-2022) renders empty; the widely indexed PDF path returns 404 bare and a server error with ?download=1; the legacy WPC host (wpc.dot.gov.in) timed out and appears decommissioned. Authoritative non-government mirrors exist (COAI, a TRAI presentation) but should not be cited as the source. Recommend resolving the live link once with a headless browser, then archiving the PDF locally - NFAP revises only every few years, so a one-off manual capture is proportionate.", "RBI also serves SOFT 404s: BS_ViewDraftDirections.aspx and BS_ViewDraftReports.aspx both return a styled 'file not available or misspelled' page rather than a 404 status. A monitor checking only HTTP status will record these as healthy forever. The working draft-consultation shelf is https://www.rbi.org.in/scripts/DraftNotificationsGuildelines.aspx - note the official misspelling 'Guildelines' in the path, which is correct and must be reproduced. Comment deadlines are not in the listing; they sit inside each draft PDF or its companion press release, so the deadline must be extracted per document.", "HIGHEST-VALUE SHELF IS HIDDEN FROM NAVIGATION: /en/documents/notification/advisories (177 items) is the densest source of broadcast and OTT content-regulation instruments in this entire map, but it does not appear in the site's Documents menu. It is discoverable only through the category index at /en/documents/reports or by direct URL. A nav-driven crawler will miss it completely. The same index reveals the true shelf inventory and per-shelf item counts (Press Releases 526, Advisories 177, Annual Reports 45, Monthly Summary for Cabinet 46), which makes it an efficient change-detection probe.", "SUGGESTED MONITORING TIER: daily - MIB advisories, MIB orders and notices, ASCI complaint outcomes (decisions appeared same-day, 24 Aug 2026). Weekly - MIB acts/policies, MIB press releases, PRGI latest updates, Broadcast Seva What's New, BARC data insights. Monthly - CBFC orders and circulars, NBDSA decisions, BCCC decisions, ASCI advisories and press announcements, Prasar Bharati latest and Free Dish, BARC policy and compliance. Hash-only (undated, no date signal to watch) - CBFC section 5B guidelines, Broadcast Seva guideline PDFs, IBDF DMCRC decisions PDF, IBDF guidelines and advisories.", "TOOLING CONSTRAINT AFFECTING VERIFICATION METHOD: direct curl from this environment is refused by the egress proxy with 403 on CONNECT for these government hosts (a policy denial, not a network fault), so every URL in this map was verified through the sanctioned WebFetch path instead. Notes about page structure therefore reflect server-rendered HTML as retrieved; where a page is JavaScript-driven this is recorded explicitly in machine_readable and quirks, and figures such as the exact item count behind ASCI's 'Show More' or BARC's tabs could not be enumerated without a headless browser.", "SRB LANDSCAPE FOR ADVISING CLIENTS: MIB's Digital Media Division lists 11 registered Level II self-regulatory bodies and ~99 OTT publishers, with individual registration letters as PDFs. IAMAI's DPCGC and IBDF's DMCRC both cover non-news OTT, so an OTT client's adjudicating body depends on its trade-body membership. On the news side, DNPA is an industry association WITHOUT registered Level II SRB status (registered news SRBs include PADMA), so its Code of Ethics has no statutory force and it publishes no decisions - a material distinction when advising on IT Rules Part III compliance.", "Two regulators are effectively geo-fenced to Indian IP ranges: i4c.mha.gov.in failed on all connection attempts across three paths (/, /advisories.aspx, /press-release.aspx) and sahyog.mha.gov.in failed on both / and /login, while DNS resolved and both are linked by MHA and indexed by search engines. NCIIPC behaved similarly but inconsistently - nciipc.gov.in/ returned real content once, yet every deep .html path timed out on both the apex and www hosts. Scraping these three requires an India-resident egress; schedule with retries and treat a timeout as transient, not as removal.", "NCCS is the best-engineered site in this entire domain and deserves the tightest monitoring. Clean server-rendered HTML, consistent DD-MM-YYYY or DD Month YYYY dates, simple path-segment pagination (/circularsSc/1, /circularsSc/2), explicit item counts, and 64 released ITSARs in a single table with both release and enforcement dates. Its consultation shelf (itsarUnderSC) was empty at time of check - a monitor must not treat zero rows as a fault. Watch for batch publishing on the SAS circulars: many items share one date, so page 1 can turn over entirely in a single day.", "The single most dangerous quirk for a naive tracker: three separate venues will make a diffing crawler report 'no change' forever. The e-Gazette homepage panel was eleven weeks stale on 24 Aug 2026. PRS's sitemap.xml has every lastmod frozen at 2021-07-17T08:43:52+00:00. The ICO news list renders as 'Loading...' placeholders with a server-rendered pagination shell around them. In all three cases the fetch returns HTTP 200 and looks healthy. Add a per-venue staleness alarm - if a venue's newest item has not advanced in N days, page a human rather than assuming quiet.", "UNDATED INSTRUMENTS ARE COMMON AND DEFEAT DATE-BASED MONITORING. The CBFC section 5B certification guidelines carry no date or version at all (only a reference to the 1978 notification they supersede). Broadcast Seva guideline PDFs use generic undated filenames (Guidelines.pdf) and are overwritten in place on amendment. Fourteen of sixteen IBDF/BCCC advisories have no date. The IBDF DMCRC decisions page exposes no dates whatsoever. For all of these, content hashing is the only viable change-detection method - URL and date monitoring will never fire.", "Government TLS and DNS misconfiguration is a recurring, non-negotiable blocker at the state and central level: India Code fails hostname verification on www.indiacode.gov.in and returns 502 on the bare host; the DoT GatiShakti Sanchar RoW portal fails hostname verification on both name variants; AP's e-Gazette returns a flat 403; and Maharashtra's e-Gazette host no longer resolves. These are not anti-bot defences that can be engineered around — they are broken deployments that must be re-tested periodically and escalated to manual checks meanwhile.", "Two of the four target High Courts could not be reached at all. Bombay HC's robots.txt repeatedly timed out or failed to parse (so the fetcher refused the site), and every Karnataka host tested — karnatakajudiciary.kar.nic.in, gazette.kar.nic.in, itbtst.karnataka.gov.in, dpal.karnataka.gov.in — timed out or was refused identically. That uniformity points to a network-path or geo-restriction affecting this environment rather than four independent outages, so these should be re-tested from an Indian egress before any conclusion is drawn about them."], "generated": "2026-08-24"}</script>
<script>
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#n').textContent = D.venues.length;
$('#g').textContent = D.generated;

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
}));

const DOMAINS = [...new Set(D.venues.map(v => v.domain))].sort();
$('#dom').innerHTML = '<option value="all">All domains</option>' +
  DOMAINS.map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('');

const state = { q:'', dom:'all', core:true };

function render(){
  const q = state.q.trim().toLowerCase();
  const list = D.venues.filter(v =>
    (!state.core || v.priority === 'core') &&
    (state.dom === 'all' || v.domain === state.dom) &&
    (!q || (v.regulator+' '+v.name+' '+v.publishes+' '+v.tmt_relevance+' '+v.url).toLowerCase().includes(q))
  );
  let html = '', lastDom = null;
  for (const v of list) {
    if (v.domain !== lastDom) {
      lastDom = v.domain;
      const n = list.filter(x => x.domain === lastDom).length;
      html += '<div class="grouphead"><b>' + esc(lastDom) + '</b><span>' + n + ' venues</span><i></i></div>';
    }
    html += '<div class="row">' +
      '<div class="line">' +
        '<div class="c-reg">' + esc(v.regulator) + '</div>' +
        '<div class="c-name">' +
          '<a class="t" href="' + esc(v.url) + '" target="_blank" rel="noopener" title="' + esc(v.url) + '">' + esc(v.name) + '</a>' +
          (v.in_tracker === 'live' ? '<span class="wired">WATCHED</span>' : '') +
          (v.publishes ? '<span class="sub">' + esc(v.publishes) + '</span>' : '') +
        '</div>' +
      '</div></div>';
  }
  $('#rows').innerHTML = html;
  $('#empty').style.display = list.length ? 'none' : 'block';
  $('#count').textContent = list.length + ' of ' + D.venues.length;
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#dom').addEventListener('change', e => { state.dom = e.target.value; render(); });
const chip = $('#corechip');
const flip = () => { state.core = !state.core; chip.classList.toggle('on', state.core);
  chip.setAttribute('aria-checked', String(state.core)); render(); };
chip.addEventListener('click', flip);
chip.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); flip(); } });
render();

$('#notelist').innerHTML = D.notes.map(n => '<li>' + esc(n) + '</li>').join('');
$('#arch').innerHTML = "\n<h2>What this is</h2>\n<p class=\"lead\">A regulatory tracker is not a scraper. It is six mechanisms stacked on each other, and\nthe tracker is only as trustworthy as the weakest one. This page describes each layer, what it must\nguarantee, and where it is currently allowed to fail.</p>\n\n<figure>\n<svg viewBox=\"0 0 1200 460\" role=\"img\" aria-label=\"Pipeline: the registry drives fetch, extract, a validate gate, identity and shaping, and only then the ledger. Rejected rows go to quarantine. The gazette lane joins at the same validate gate and its items are flagged for verification. The signal lane terminates in a separate signals store that never joins the ledger. Memo drafting and alerting draw from the ledger only.\">\n  <defs>\n    <marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/></marker>\n    <marker id=\"ard\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8A2B1C\"/></marker>\n  </defs>\n  <g font-family=\"'IBM Plex Mono',monospace\" font-size=\"11.5\" fill=\"currentColor\">\n\n    <rect x=\"20\" y=\"150\" width=\"120\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"80\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">REGISTRY</text>\n    <text x=\"80\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">258 venues</text>\n    <line x1=\"140\" y1=\"179\" x2=\"176\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"158\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">reads</text>\n\n    <rect x=\"180\" y=\"150\" width=\"110\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"235\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">FETCH</text>\n    <text x=\"235\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">http or browser</text>\n    <line x1=\"290\" y1=\"179\" x2=\"326\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"308\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">html</text>\n\n    <rect x=\"330\" y=\"150\" width=\"110\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"385\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">EXTRACT</text>\n    <text x=\"385\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">date, title, link</text>\n    <line x1=\"440\" y1=\"179\" x2=\"476\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"458\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">rows</text>\n\n    <rect x=\"480\" y=\"150\" width=\"120\" height=\"58\" fill=\"none\" stroke=\"#8A2B1C\" stroke-width=\"2\"/>\n    <text x=\"540\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#8A2B1C\">VALIDATE</text>\n    <text x=\"540\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8A2B1C\" opacity=\"0.85\">the gate</text>\n\n    <rect x=\"420\" y=\"40\" width=\"240\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/>\n    <text x=\"540\" y=\"60\" text-anchor=\"middle\" font-size=\"11\">GAZETTE LANE</text>\n    <text x=\"540\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" opacity=\"0.7\">what regulator sites have not posted yet</text>\n    <line x1=\"540\" y1=\"86\" x2=\"540\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\" marker-end=\"url(#ar)\"/>\n    <text x=\"552\" y=\"120\" font-size=\"9.5\" opacity=\"0.7\">same gate, flagged</text>\n\n    <line x1=\"540\" y1=\"208\" x2=\"540\" y2=\"254\" stroke=\"#8A2B1C\" stroke-width=\"1.4\" marker-end=\"url(#ard)\"/>\n    <text x=\"552\" y=\"236\" font-size=\"9.5\" fill=\"#8A2B1C\">rejects</text>\n    <rect x=\"480\" y=\"256\" width=\"120\" height=\"34\" fill=\"none\" stroke=\"#8A2B1C\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n    <text x=\"540\" y=\"278\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8A2B1C\">quarantine</text>\n\n    <line x1=\"600\" y1=\"179\" x2=\"636\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"618\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">clean</text>\n\n    <rect x=\"640\" y=\"150\" width=\"120\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"700\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">IDENTIFY</text>\n    <text x=\"700\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">hash, dedupe</text>\n    <line x1=\"760\" y1=\"179\" x2=\"796\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"778\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">new only</text>\n\n    <rect x=\"800\" y=\"150\" width=\"120\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"860\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">SHAPE</text>\n    <text x=\"860\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">classify, fold</text>\n    <line x1=\"920\" y1=\"179\" x2=\"996\" y2=\"179\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/>\n    <text x=\"958\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.65\">append</text>\n\n    <rect x=\"1000\" y=\"150\" width=\"130\" height=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n    <text x=\"1065\" y=\"174\" text-anchor=\"middle\" font-weight=\"600\">LEDGER</text>\n    <text x=\"1065\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" opacity=\"0.7\">append only</text>\n\n    <rect x=\"420\" y=\"330\" width=\"240\" height=\"46\" fill=\"none\" stroke=\"#8A2B1C\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/>\n    <text x=\"540\" y=\"350\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8A2B1C\">SIGNAL LANE</text>\n    <text x=\"540\" y=\"366\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A2B1C\" opacity=\"0.8\">instruments never published anywhere</text>\n    <line x1=\"660\" y1=\"353\" x2=\"736\" y2=\"353\" stroke=\"#8A2B1C\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\" marker-end=\"url(#ard)\"/>\n\n    <rect x=\"740\" y=\"330\" width=\"140\" height=\"46\" fill=\"none\" stroke=\"#8A2B1C\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n    <text x=\"810\" y=\"350\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#8A2B1C\">SIGNALS</text>\n    <text x=\"810\" y=\"366\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A2B1C\" opacity=\"0.8\">separate store</text>\n    <text x=\"810\" y=\"396\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#8A2B1C\" opacity=\"0.85\">no path into the ledger</text>\n\n    <path d=\"M1030,208 L1030,382 L965,382 L965,406\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" marker-end=\"url(#ar)\"/>\n    <path d=\"M1100,208 L1100,382 L1120,382 L1120,406\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" marker-end=\"url(#ar)\"/>\n    <text x=\"1065\" y=\"374\" text-anchor=\"middle\" font-size=\"9.5\" opacity=\"0.7\">new only</text>\n\n    <rect x=\"895\" y=\"408\" width=\"140\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"965\" y=\"428\" text-anchor=\"middle\" font-size=\"11\">MEMO DRAFT</text>\n    <rect x=\"1060\" y=\"408\" width=\"120\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\n    <text x=\"1120\" y=\"428\" text-anchor=\"middle\" font-size=\"11\">ALERT</text>\n  </g>\n</svg>\n<figcaption>The main path runs left to right. The validate gate is the only place a row is refused,\nand what it refuses goes to quarantine rather than disappearing. The gazette lane feeds through that\nsame gate, because an instrument found on the gazette still has to be a well-formed row; it carries a\nverification flag onward. The signal lane is different: it ends in its own store with no path into the\nledger at all, because a press report of an unpublished letter is a lead, not an instrument. Memo\ndrafting and alerting read the ledger only.</figcaption>\n</figure>\n\n<h2>The six layers</h2>\n\n<h3>1. Registry \u2014 what to watch</h3>\n<p>A list of venues with, for each, the URL that actually shows dated rows, the date formats that\nappear there, the domains a link is allowed to point at, how to page, and every known quirk.\nEverything downstream is driven by this file, which is why adding a regulator is a config change\nrather than a code change. It also has to record what <em>cannot</em> be reached, because an\nunlisted blind spot is indistinguishable from a covered one.</p>\n\n<h3>2. Fetch \u2014 reaching the page</h3>\n<p>Roughly a quarter of Indian regulatory venues return an empty shell to a plain HTTP client. MeitY,\nDPIIT, CBIC and the income-tax site are JavaScript applications; the Supreme Court's search sits\nbehind a CAPTCHA; several sites serve broken TLS chains or block non-browser user agents. A tracker\nthat only speaks HTTP silently covers three quarters of the landscape.</p>\n<div class=\"pull\">The dangerous failure is not a timeout. It is a page that returns HTTP 200 with an\nempty body, or a listing whose rows load by AJAX after the HTML arrives. Both look like a healthy poll\nthat found nothing new. Any fetch that yields zero rows from a venue that normally has rows must be\ntreated as a failure, not as an absence of news.</div>\n\n<h3>3. Extract \u2014 pulling rows out</h3>\n<p>Per venue: find the dated rows, and for each one take the date, the title and the document link.\nDates arrive in at least six formats across these venues, and several listings carry no date column\nat all, so those can only be watched by diffing snapshots or hashing the linked PDFs.</p>\n\n<h3>4. Validate \u2014 the gate</h3>\n<p>Before anything joins the ledger it must pass fixed checks: the date parses against the formats\nthat venue declares, the link points at a domain that venue is allowed to use, the title is a\nplausible length. Rows that fail go to quarantine with a reason attached. This is the layer that\nmakes the difference between a tracker and a rumour mill.</p>\n\n<h3>5. Identify \u2014 is this new?</h3>\n<p>A stable identity per instrument, computed from the normalised title plus the date, so the same\ndocument seen twice on two venues is one entry. Without this, every sweep re-reports everything.</p>\n\n<h3>6. Shape \u2014 making it readable</h3>\n<p>Three deterministic steps that turn a correct ledger into one a partner can scan: a short display\ntitle, because official Indian instrument titles run past thirty words; a single factual line saying\nwhat the instrument does, because four authorisation rules notified on the same day are otherwise\nindistinguishable; and a fold, so a notice that merely announces a document does not become a second\nrow alongside it.</p>\n\n<h2>Why two extra lanes exist</h2>\n<p>The main path can only find what regulators publish. Two categories escape it, and both were\nobserved in the July to August test window.</p>\n<ul>\n<li><b>Published elsewhere first.</b> The gazette is the legal source of truth, and regulator sites\nlag it. Two sets of telecom rules were gazetted and still absent from the department's own rules\nshelf two weeks later. The gazette lane catches these and flags them as needing verification.</li>\n<li><b>Never published at all.</b> A large share of Indian regulatory instruments are letters:\nadvisories served on named companies, directions to service providers, blocking orders, ministry\nreferences. They reach the public through the press or civil society, if at all. The signal lane\nwatches those sources and records what it finds as clearly unofficial leads.</li>\n</ul>\n\n<h2>What it takes to run</h2>\n<div class=\"need\"><div class=\"k\">Network path</div><div class=\"v\">A machine that can reach gov.in hosts. Cloud sandboxes generally cannot, which is why the working system runs a local extractor and uses a cloud session only as a fetch-and-copy transport.</div></div>\n<div class=\"need\"><div class=\"k\">Headless browser</div><div class=\"v\">Required for the quarter of venues that render client-side. Without it, MeitY, DPIIT and the tax sites are permanently invisible.</div></div>\n<div class=\"need\"><div class=\"k\">Scheduler</div><div class=\"v\">Something that fires on a cadence and, critically, complains when a run fails. A silent scheduler is worse than none.</div></div>\n<div class=\"need\"><div class=\"k\">State store</div><div class=\"v\">An append-only ledger plus per-source health. History is never rewritten, so a missed item stays visible as a gap.</div></div>\n<div class=\"need\"><div class=\"k\">PDF text extraction</div><div class=\"v\">Instruments are PDFs. Memo drafting needs their operative text, and some scanned ones have no text layer at all.</div></div>\n<div class=\"need\"><div class=\"k\">Document assembly</div><div class=\"v\">A fixed template filled from extracted fields, so a memo is a mechanical fill rather than generated prose.</div></div>\n<div class=\"need\"><div class=\"k\">Audit scripts</div><div class=\"v\">Automated assertions that the ledger agrees with its own rules. This is what catches classification drift before a partner does.</div></div>\n<div class=\"need\"><div class=\"k gap\">A human</div><div class=\"v\">Every interpretive line in a memo carries an associate-review marker, and every instrument is verified against the gazette text before it reaches a client. The pipeline finds and drafts; it does not advise.</div></div>\n\n<h2>Where automation stops</h2>\n<ul>\n<li><b>Court dockets.</b> High Court and Supreme Court listings sit behind CAPTCHAs and POST forms.\nJudgments are reachable; comprehensive case tracking realistically needs a paid docket service.</li>\n<li><b>Letter-form instruments.</b> Nothing can scrape a document that was never posted. The signal\nlane surfaces leads; confirmation is a phone call.</li>\n<li><b>Stale-but-healthy sites.</b> Two venues were serving content weeks or years out of date while\nreturning perfectly valid responses. No amount of scraping detects this; only cross-checking against\na second source does.</li>\n<li><b>State instruments.</b> Thirty-odd state gazettes, most without usable listings. Worth watching\nthe handful of states that actually legislate on gaming and platforms, not all of them.</li>\n</ul>\n";
