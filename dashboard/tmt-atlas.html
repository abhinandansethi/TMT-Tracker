<title>TMT Source Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@300;400;500;600&display=swap">
<style>
:root{
  --navy:#003F62; --navy-d:#002B43; --navy-l:#1B6288; --navy-wash:#EAF0F4;
  --ochre:#AA8918; --ochre-wash:#F7F0DC; --alarm:#8A2B1C; --alarm-wash:#F7E9E6;
  --ok:#1B6B4A; --ok-wash:#E6F1EB;
  --ink:#111315; --mute:#4E555A; --faint:#7C848A; --ghost:#8F9396; --off:#A3A6A8;
  --paper:#FFFFFF; --ground:#E4E8EA; --panel:#F4F6F7; --rule:#C9D1D6; --rule2:#DDE3E7; --rule3:#EBEFF1;
  --serif:Spectral,Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --grid:238px minmax(0,1fr);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
input,select,button{font-family:inherit}
input:focus,select:focus{outline:none}
input::placeholder{color:var(--ghost)}
.sheet{max-width:1440px;margin:0 auto;background:var(--paper);min-height:100vh}

.band{background:var(--navy);color:#fff;padding:26px 64px 22px}
.band .in{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-weight:400;font-size:29px;letter-spacing:.005em;color:#fff}
.wordmark b{font-weight:600}
.band .meta{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#B9CEDC;text-align:right;line-height:1.7}
.band .meta b{color:#fff;font-weight:500}
.tabs{background:var(--navy-d);padding:0 64px;display:flex;gap:2px}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  padding:13px 18px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
  color:#93B2C6;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--ochre);background:rgba(255,255,255,.06)}
.tabs button:hover{color:#fff}
.view{display:none;padding:0 64px 90px}
.view.on{display:block}

.controls{margin-top:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap}
.controls .left{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
#q{width:262px;max-width:100%;border:0;border-bottom:2px solid var(--navy);background:transparent;font-size:13px;color:var(--ink);padding:0 0 7px}
#dom,#reach{border:0;border-bottom:2px solid var(--navy);background:transparent;font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--navy);padding:0 0 7px;appearance:none;-webkit-appearance:none;cursor:pointer}
#dom{width:236px}#reach{width:174px}
.tog{cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--rule);
  background:transparent;color:var(--faint);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em}
.tog.on{border-color:var(--navy);background:var(--navy);color:#fff}
.count{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint)}

.tablewrap{overflow-x:auto}.tbl{min-width:1060px}
.thead{margin-top:22px;border-bottom:2px solid var(--navy)}
.thead .r{display:grid;grid-template-columns:var(--grid);column-gap:20px;padding:0 0 9px 4px;
  font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--navy);font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:14px;padding:30px 4px 8px;border-bottom:2px solid var(--ochre);margin-top:10px}
.grouphead b{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy)}
.grouphead span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ochre);font-weight:600}
.grouphead i{flex:1}
.row{border-bottom:1px solid var(--rule3);background:var(--paper)}
.row:hover{background:var(--navy-wash)}
.row .line{display:grid;grid-template-columns:var(--grid);column-gap:20px;align-items:baseline;padding:13px 0 14px 4px}
.c-reg{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--navy);line-height:1.4}
.c-name{min-width:0}
.c-name>.t{font-family:var(--serif);font-size:16.5px;font-weight:500;color:var(--ink);
  border-bottom:1px dotted var(--rule);padding-bottom:2px;text-decoration:none}
a.t:hover{color:var(--navy);border-bottom-color:var(--navy);border-bottom-style:solid;text-decoration:none}
.c-name>.sub{display:block;margin-top:4px;font-size:12.5px;line-height:1.44;color:var(--mute);max-width:70ch}
.empty{padding:34px 0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost)}

.arch{max-width:104ch;padding-top:34px}
.arch h2{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--navy);
  font-weight:600;margin:46px 0 14px;padding-top:12px;border-top:2px solid var(--navy)}
.arch h2:first-child{margin-top:0}
.arch h3{font-family:var(--serif);font-size:19.5px;font-weight:600;margin:26px 0 8px;color:var(--navy)}
.arch p{font-family:var(--serif);font-size:16.5px;line-height:1.62;color:#25292B;margin:0 0 14px;max-width:78ch}
.arch p.lead{font-size:18px;color:var(--ink)}
.arch ul{margin:0 0 16px;padding-left:0;list-style:none;max-width:80ch}
.arch li{font-family:var(--serif);font-size:16px;line-height:1.56;color:#25292B;padding:8px 0 8px 22px;
  border-bottom:1px solid var(--rule3);position:relative}
.arch li:before{content:"";position:absolute;left:2px;top:17px;width:8px;height:2px;background:var(--ochre)}
.arch b{font-weight:600}
figure{margin:26px 0 8px}
figure svg{width:100%;height:auto;max-width:100%;color:var(--navy)}
figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--faint);margin-top:12px;line-height:1.65}
.need{display:grid;grid-template-columns:180px minmax(0,1fr);column-gap:24px;padding:12px 0;border-bottom:1px solid var(--rule2);align-items:baseline}
.need .k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--navy)}
.need .k.gap{color:var(--alarm)}
.need .v{font-family:var(--serif);font-size:15.5px;line-height:1.52;color:#25292B}
.pull{border-left:4px solid var(--alarm);background:var(--alarm-wash);padding:14px 20px;margin:22px 0;
  font-family:var(--serif);font-size:16px;line-height:1.55;max-width:80ch}
.notes li{font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--mute)}
@media (max-width:760px){.band,.tabs,.view{padding-left:22px;padding-right:22px}
  .need{grid-template-columns:1fr;row-gap:4px}.dl{grid-template-columns:1fr;row-gap:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="sheet">
  <div class="band"><div class="in">
    <div class="wordmark">TMT <b>Source Atlas</b></div>
    <div class="meta"><b id="n"></b> venues, every one verified by live fetch<br><span id="g"></span></div>
  </div></div>
  <nav class="tabs">
    <button class="on" data-v="sources">Sources</button>
    <button data-v="architecture">Architecture</button>
    <button data-v="notes">Engineering notes</button>
  </nav>

  <section class="view on" id="v-sources">
    <div class="controls">
      <div class="left">
        <input type="text" id="q" placeholder="Search regulator, page or purpose">
        <select id="dom"></select>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="count" id="count"></span>
        <div class="tog on" id="corechip" role="checkbox" aria-checked="true" tabindex="0"><span>Core only</span></div>
      </div>
    </div>
    <div class="tablewrap"><div class="tbl">
      <div class="thead"><div class="r">
        <div>Regulator</div><div>Page</div>
      </div></div>
      <div id="rows"></div>
    </div></div>
    <div class="empty" id="empty" style="display:none">Nothing matches</div>
  </section>

  <section class="view" id="v-architecture"><div class="arch" id="arch"></div></section>
  <section class="view" id="v-notes"><div class="arch"><h2>What breaks a scraper</h2>
    <p>Findings from fetching all of them. Each one is a defect a naive build walks into.</p>
    <ul class="notes" id="notelist"></ul></div></section>
</div>

Guidelines are the proof case", "priority": "core", "quirks": "No index; paths must come from the parent press release. Filename pattern (doc2025115685601.pdf) is semi-structured but the trailing sequence is not derivable, so do not attempt enumeration. Separate host from www.pib.gov.in.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "pib_allrel_form", "regulator": "Press Information Bureau", "name": "PIB All Releases - ministry + date filter", "url": "https://pib.gov.in/allRel.aspx", "publishes": "Complete archive of PIB press releases filterable by ministry and by exact date; the only way to get ministry-scoped or historical PIB output", "fetch_status": "OK", "machine_readable": "post_form", "date_format": "Selected via three separate dropdowns - day (1-31 plus 'All'), month (named, rendered in Hindi as जनवरी..दिसंबर), year (2026 down to 2017). Displayed timestamps are 'DD Mon YYYY HH:MM:SS AM/PM'.", "pagination": "Results are per ministry-per date; postback-driven", "cadence": "Continuous, same-day", "tmt_relevance": "This is how you get every MeitY, DoT and MIB release for a given day - the completeness backstop the RSS feed cannot provide.", "priority": "core", "quirks": "ASP.NET WebForms with a ministry dropdown of 100+ departments and three date dropdowns; changing any dropdown fires an auto-postback ('Changing the value will update the page content'). The rendered markdown did not expose the hidden-field names, so a scraper must read the raw HTML and echo __VIEWSTATE / __VIEWSTATEGENERATOR / __EVENTVALIDATION plus __EVENTTARGET for the dropdown that changed. Month labels come back in Hindi even on the English page - match by dropdown index, not by label text. Release detail lives at PressReleaseDetail.aspx?PRID=<n>; PRIDs are globally sequential across all ministries, so a PRID range scan is a viable cross-check.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "eur_lex", "regulator": "Publications Office of the European Union", "name": "EUR-Lex", "url": "https://eur-lex.europa.eu/homepage.html", "publishes": "The Official Journal of the EU (L series legislation, C series information) plus all EU legal acts, in 24 languages back to 1952", "fetch_status": "OK", "machine_readable": "api", "date_format": "CELEX identifiers plus ISO-style dates; OJ references as 'OJ L <n>, DD.MM.YYYY'", "pagination": "Search results page; documents are addressed by CELEX number or ELI URI", "cadence": "Daily - a new Official Journal is published every working day, now act-by-act rather than as a bound issue", "tmt_relevance": "GDPR, the Data Act, DSA/DMA and the AI Act are the cross-border obligations an Indian firm's TMT clients are actually measured against - Indian data-processing and platform clients need the L-series text, not press coverage of it.", "priority": "core", "quirks": "Verification was partial and you should plan for that. The homepage fetched OK, but every technical page rendered as a shell for us: the 'My RSS alerts' help page (/content/help/my-eurlex/my-rss-feeds.html) returned only its title with none of the feed documentation, the OJ direct-access page (/oj/direct-access.html) returned only navigation, the L-series daily view returned no feed link and no date pattern, and /oj/all/all-oj-date.html was robots-blocked. So NO RSS URL PATTERN WAS VERIFIED. What the help page's own title and description confirm is that RSS on EUR-Lex is account-bound - you create alerts inside a My EUR-Lex account and each generates a personal feed URL; there is no clean public 'latest OJ' feed to subscribe to anonymously. The reliable machine-readable route is not RSS at all: it is the CELLAR SPARQL endpoint and the EUR-Lex web service (documented at /content/help/data-reuse/webservice.html), which mature client libraries target - use those and skip the HTML entirely. EUR-Lex is also heavy on interstitial 'choose the experimental features you want to try' pages that confuse naive scrapers.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "et_telecom", "regulator": "Secondary tracker (Economic Times / Times Internet)", "name": "ET Telecom - Policy RSS", "url": "https://telecom.economictimes.indiatimes.com/rss/policy", "publishes": "Telecom industry and policy news - DoT licence amendments, TRAI directions, spectrum, satcom", "fetch_status": "BLOCKED", "machine_readable": "rss", "date_format": "unverified (ET feeds conventionally carry RFC-822 pubDate)", "pagination": "Rolling feed per section", "cadence": "Daily, high volume", "tmt_relevance": "The trade venue where DoT licence-amendment letters and TRAI directions served on licensees get reported, since those are frequently not posted on dot.gov.in.", "priority": "core", "quirks": "COULD NOT VERIFY: this session's egress proxy denied the host outright (HTTP 403 on both /rss/topstories and /rss/policy) - an environment restriction, not a site defect, so re-verify from the firm's own network before ruling it out. Section feed URLs follow https://telecom.economictimes.indiatimes.com/rss/<section> with at least these sections: topstories, industry, policy, 5g-corner, telecom-equipment, devices, mvas-apps, enterprise-services, internet, prepaid-postpaid, satcom. ET properties are aggressive about bot-blocking and often gate article bodies behind a registration wall even when the feed is open.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "sflc_in", "regulator": "Secondary tracker (Software Freedom Law Center, India)", "name": "SFLC.in", "url": "https://sflc.in/feed/", "publishes": "RTI-derived data on website blocking and internet shutdowns, statements on takedown and account-restriction orders, legal analysis", "fetch_status": "OK", "machine_readable": "rss", "date_format": "Full RFC-822 pubDate with time and offset ('Thu, 20 Aug 2026 07:52:39 +0000')", "pagination": "Rolling feed window; WordPress archives behind it", "cadence": "Roughly weekly - items on 6, 13 and 20 Aug 2026", "tmt_relevance": "The quantitative record of the unpublished layer: SFLC's RTI work established that 14,221 websites were blocked between 2010 and 2018 and that MeitY refused to release the 2018 URLs or the orders themselves on confidentiality grounds.", "priority": "core", "quirks": "Clean WordPress RSS with proper dates - one of the few sources in this set that needs no special handling. Publication is bursty and low-volume, so absence of items is not absence of events. SFLC also runs a separate internet-shutdown tracker that is not in this feed and must be ingested separately.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "internet_freedom_foundation", "regulator": "Secondary tracker (digital rights NGO)", "name": "Internet Freedom Foundation", "url": "https://internetfreedom.in/rss/", "publishes": "Legal analysis, RTI outcomes, litigation updates, and comments filed on draft rules; frequently publishes the underlying government letter or order obtained via RTI or discovery", "fetch_status": "OK", "machine_readable": "rss", "date_format": "RFC-822 pubDate ('Fri, 21 Aug 2026')", "pagination": "Feed is a rolling window; site archives are static pages", "cadence": "Multiple posts per week - three items in the four days to 21 Aug 2026", "tmt_relevance": "Surfaces instruments that exist nowhere else: the verified feed carried IFF's filed suggestions on the Draft Central Motor Vehicles (Amendment) Rules 2026 and an item on a .in domain suspension driven by a registry 'reserved name' decision - a pure letter-form action with no public order.", "priority": "core", "quirks": "Feed lives at /rss/ (NOT /feed/ or /rss.xml). Site is Gatsby 5.x - a static React build, so on-site search is client-side and the HTML is fine to parse but class names churn between builds; use the feed. Outbound links carry a ?ref=internetfreedom.in tracking parameter - strip it before de-duplication. I cation Union (UN specialised agency)", "name": "ITU Hub news RSS", "url": "https://www.itu.int/hub/feed/", "publishes": "ITU news and analysis on spectrum, satellite, standards and connectivity", "fetch_status": "OK", "machine_readable": "rss", "date_format": "RFC-822 with offset ('Wed, 19 Aug 2026 09:26:19 +0000')", "pagination": "Rolling feed; articles at /hub/YYYY/MM/<slug>/", "cadence": "Several items per week", "tmt_relevance": "Spectrum and satellite policy upstream of Indian licensing - radio-astronomy vs satellite-signal coexistence stories in the verified feed map directly onto the spectrum-sharing questions in Indian satcom authorisations.", "priority": "adjacent", "quirks": "This is the editorial Hub feed, not a standards feed - it will not tell you when a Recommendation or Radio Regulation is revised. Clean RSS with proper dates, so no special handling. Feed path is /hub/feed/, distinct from the older /en/mediacentre/ press pages which have no feed.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "archive_org_gazette", "regulator": "Internet Archive / Public Resource (mirror of Directorate of Printing scans)", "name": "Gazette of India scans on the Internet Archive", "url": "https://archive.org/details/in.gazette.2014.319", "publishes": "Scanned back-runs of the Gazette of India uploaded under 'Directorate of Printing, Government of India'; item identifiers follow in.gazette.<YYYY>.<issue-number>", "fetch_status": "BLOCKED", "machine_readable": "api", "date_format": "Year and issue number encoded in the identifier; item metadata carries an ISO date field", "pagination": "archive.org advancedsearch.php / scrape API paginate with rows+page or a cursor; identifiers are also directly enumerable", "cadence": "Historical bulk uploads, not a live feed - useful for backfill, not for monitoring", "tmt_relevance": "Backfill and permanence layer: gives you a citable copy of older notifications when egazette.gov.in rotates or drops nizationChart_17022026.pdf)", "pagination": "none", "cadence": "rare - charts refreshed roughly annually", "tmt_relevance": "Establishes which MHA arm owns interception, cyber and I4C policy, and is the reachable proxy for the geo-fenced I4C site", "priority": "adjacent", "quirks": "No dated listing at all - the only date signal is inside PDF filenames and the /sites/default/files/YYYY-MM/ path bucket. Contains no interception rules or gaming instruments despite being the owning division.", "domain": "Cross-cutting nets and trackers", "in_tracker": "not_wired"}, {"id": "ofcom", "regulator": "Ofcom (UK communications regulator)", "name": "Ofcom Consultations and Statements", "url": "https://www.ofcom.org.uk/consultations-and-statements/", "publishes": "Every Ofcom consultation and statement across online safety, spectrum, phones and broadband, and internet-based services - 2,034 items in the archive at fetch time", "fetch_status": "OK", "machine_readable": "static_html", "date_format": "'Published: 25 March 2026' (D Month YYYY)", "pagination": "Configurable page size of 12, 27, 54 or 108 with numbered pages; the URL parameter names were not exposed in the rendered output", "cadence": "Continuous, several items per month", "tmt_relevance": "The Online Safety Act implementation is the template Indian intermediary regulation is measured against, and Indian platforms with UK users are directly in scope. Verified live item: an online suicide forum investigation and review of enforcement powers (20 July 2026).", "priority": "adjacent", "quirks": "NO RSS anywhere - Ofcom offers only email updates, so either subscribe by email or diff the HTML listing. Filters are rich (topic, status Open / Pending Statement / Statement Published, updated-after and updated-before dates, PDF-inclusion toggle) but they are UI state; you must capture the real query parameters from the network tab before automating. Substantive content is in PDFs, not on the page.", "domain": "Cross-cutting nets rior months; other posts weekly-ish", "tmt_relevance": "Peer-firm read on what the instrument means in practice. Verified latest: 'TechTicker 80: What did the Delhi HC say about AI and copyright?' (6 Aug 2026).", "priority": "adjacent", "quirks": "NO RSS - /feed/ returns 404 and /category/tech-ticker/ and /tech-ticker/ both 404. It is a custom CMS, not WordPress, so none of the usual WordPress endpoints exist. Article IDs are sequential integers (/article/638, /article/673, /article/691), which makes ID-walking the only practical change-detection method - crawl /writings and diff. Note the historical URL scheme changed: older issues live at flat slugs (/tech-ticker-issue-30-november-2021/) while newer ones use /article/<id>/<slug>, so backfill needs both patterns. Monthly cadence means it is a digest, never a first-alert source.", "domain": "Telecom, spectrum and equipment", "in_tracker": "not_wired"}, {"id": "teamlease_regtech", "regulator": "Secondary tracker (commercial RegTech aggregator)", "name": "TeamLease RegTech - Legal Updates", "url": "https://www.teamleaseregtech.com/updates/", "publishes": "Aggregated compliance updates from central, state and local regulators - notifications, circulars, settlement prices, filing deadlines, with the issuing body named", "fetch_status": "OK", "machine_readable": "static_html", "date_format": "'August 23, 2026'", "pagination": "'View More Updates Results' button (JS-driven load-more) rather than numbered pages or a page parameter", "cadence": "Continuous; 20,293 legal updates in the free archive at fetch time, updates published within 24-48 hours of notification", "tmt_relevance": "Breadth insurance rather than TMT depth - it monitors 3,700+ government websites, so it catches obscure state and sectoral instruments a TMT-focused tracker would never crawl. Weak on MeitY/DoT/MIB specifically; the visible recent items were MCX, NCCL, Income Tax, NABARD, SEBI, DGFT.", "priority": "adjacent", "quirks": "No RSS and no public API Status", "url": "https://tdsat.gov.in/Delhi/services/casestatus.php?chek=1234", "publishes": "Per-case status, hearing history and next date", "fetch_status": "OK", "machine_readable": "post_form", "date_format": "not observed", "pagination": "None — single case lookup", "cadence": "Continuous", "tmt_relevance": "Docket monitoring for live client matters before TDSAT", "priority": "adjacent", "quirks": "Lookup-by-known-case only; there is no way to enumerate the docket, so this supports watching cases you already know about, not discovering new filings.", "domain": "Telecom, spectrum and equipment", "in_tracker": "not_wired"}, {"id": "trai_rss", "regulator": "TRAI", "name": "TRAI sitewide RSS", "url": "https://trai.gov.in/rss.xml", "publishes": "VERIFIED LAGGING (~6 weeks behind site on 24-08-2026). Never rely on it as primary trigger; HTML listings govern.", "fetch_status": "BLOCKED", "machine_readable": "rss", "date_format": "RFC-822", "pagination": "none", "cadence": "every_run", "tmt_relevance": "", "priority": "adjacent", "quirks": "VERIFIED LAGGING (~6 weeks behind site on 24-08-2026). Never rely on it as primary trigger; HTML listings govern.", "domain": "Telecom, spectrum and equipment", "in_tracker": "supplement"}, {"id": "cdot", "regulator": "Centre for Development of Telematics (C-DOT), DoT", "name": "C-DOT official website", "url": "https://www.cdot.in/", "publishes": "R&D product information, tenders (new and archived), news, technology-transfer portal - NO binding regulatory instruments", "fetch_status": "OK", "machine_readable": "static_html", "date_format": "not applicable to instruments", "pagination": "tenders split by ?type=new and ?type=arc", "cadence": "tenders and news", "tmt_relevance": "Verified negative: C-DOT is an R&D and technology-transfer body, not an issuing authority - exclude from instrument monitoring", "priority": "watch", "quirks": "Legacy path structure /cdotweb/web/*.php with a required ?lang=en parameter. Also hosts a mirror of
