# TMT Regulatory Radar — nginx in front of the service on 127.0.0.1:8080.
# Installed by server/deploy/install.sh (which substitutes __DOMAIN__; "_" means "any host").
# nginx terminates TLS and proxies; it does NOT do the authentication — the app does, with the
# same AUTH_USERS credentials whether or not nginx is in front, so there is one login story.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # A scan page is ~200 KB and Ask/Draft answers are small; the long-running work never
    # travels through HTTP (jobs run in the service), so ordinary timeouts are fine except for
    # the model routes, which can take a minute with web search.
    client_max_body_size 1m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app sets X-Robots-Tag and Cache-Control itself; nothing here overrides them.
    }
}
