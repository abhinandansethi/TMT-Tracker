# TMT Regulatory Radar — brief the backlog.
#
# Separate from sweep.yml on purpose. The sweep collects and must stay inside its timeout, so it
# briefs only a small number of newly-arrived items. This job exists to work through the whole
# corpus (~361 instruments and judgments) in one pass, so coverage is not rationed at 80 per
# sweep. It reads the feed the sweep already committed, fetches each document, asks the model
# what the instrument does, and commits only pipeline/brief_cache.json. It never sweeps, never
# touches the ledger, and never rebuilds the page — Vercel does that from the committed cache.
#
# Trigger: a human, always. There is deliberately NO schedule, for the same reason sweep.yml has
# none: this job fetches hundreds of documents from government servers, which is collection, and
# the per-source legal analysis (engine/audit/) rests on that load being occasional and
# human-initiated rather than unattended and repetitive. Fetches are paced by --delay on top of
# model latency, so the load stays at the de-minimis rate that analysis describes.
# Do not add a `schedule:` trigger without revisiting it.

name: briefs
run-name: "Brief the backlog → what each update actually says"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items to brief this run (0 = no limit, work the whole backlog)"
        required: false
        default: "0"
      force:
        description: "Re-brief everything, including items already briefed under the current prompt"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Shared with sweep.yml on purpose: sweep also commits pipeline/brief_cache.json (it briefs a
# small slice of new items), so the two would race on the same file if they ran together.
# Queue rather than rely on rebase-and-retry to untangle a same-file conflict.
concurrency:
  group: tmt-radar-pipeline
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    # ~361 items, each a document fetch plus a model call, paced ~1s apart: roughly 40 minutes.
    # Generous headroom so a slow government server cannot truncate the backlog.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record the pre-run brief count
        # Snapshotted so the coverage step can assert the run actually achieved something.
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("pipeline/brief_cache.json")
          print(f"count={len(json.loads(p.read_text())) if p.exists() else 0}")
          PY

      - name: Brief the backlog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Dispatch inputs are free text from whoever pressed the button. They are bound to env
          # vars and quoted below, NEVER interpolated into this script with ${{ }} — GitHub
          # substitutes those textually before bash parses the line, so a crafted value would run
          # as a command in a step that holds both API keys and a repo-write token.
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::No LLM key configured. Add OPENAI_API_KEY or ANTHROPIC_API_KEY as a repository secret."
            exit 1
          fi
          ARGS=""
          case "$LIMIT" in
            ''|0) ;;                                    # unset or 0 -> no cap, work the backlog
            *[!0-9]*) echo "::error::limit must be a non-negative whole number (got '$LIMIT')"; exit 1 ;;
            *) ARGS="--limit $LIMIT" ;;
          esac
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "running: pipeline/brief.py $ARGS"
          python pipeline/brief.py $ARGS

      - name: Report coverage and assert progress
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, "pipeline")
          import brief as B
          cache = json.loads(pathlib.Path("pipeline/brief_cache.json").read_text()) if pathlib.Path("pipeline/brief_cache.json").exists() else {}
          items = json.loads(pathlib.Path("data/items.json").read_text())["items"]
          scope = [i for i in items if i.get("lane") in ("instruments", "judgments") and B.doc_url_of(i)]
          # Count only briefs that are actually current: same document AND same prompt version.
          # Bare key presence overstates — it counts entries a prompt bump has already invalidated.
          fresh = [i for i in scope
                   if cache.get(i["id"], {}).get("doc_hash") == B.doc_hash(i)
                   and cache.get(i["id"], {}).get("prompt_version") == B.PROMPT_VERSION]
          by_lane = {}
          for i in scope:
              lane = i.get("lane")
              d = by_lane.setdefault(lane, [0, 0])
              d[1] += 1
              if i in fresh: d[0] += 1
          for lane, (got, tot) in sorted(by_lane.items()):
              print(f"{lane:12s} {got}/{tot} briefed")
          added = len(cache) - int(os.environ.get("BEFORE") or 0)
          print(f"cache grew by {added} entries this run")
          print(f"::notice::Briefs current for {len(fresh)}/{len(scope)} items " +
                " · ".join(f"{k} {v[0]}/{v[1]}" for k, v in sorted(by_lane.items())))
          # A run that briefed nothing is a failure, not a quiet success: a bad key, a provider
          # outage or a WAF blocking every host all look identical without this.
          if added <= 0 and len(fresh) < len(scope):
              sys.exit(f"::error::Ran to completion but added no briefs, with "
                       f"{len(scope) - len(fresh)} still outstanding — treat this run as failed")
          PY

      - name: Commit the briefs
        run: |
          git config user.name  "tmt-radar-briefs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/brief_cache.json
          if git diff --cached --quiet; then
            echo "no new briefs"
          else
            git commit -m "briefs: $(date -u '+%Y-%m-%d %H:%MZ') (backlog run)"
            # The sweep lane can commit while this runs; rebase rather than lose the work.
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i) — rebasing onto the remote and retrying"
              [ "$i" = 3 ] && { echo "::error::could not push after 3 attempts"; exit 1; }
              git pull --rebase || exit 1
            done
          fi
